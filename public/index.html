<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#09090b">
<title>Nexus — Command Deck</title>
<link rel="icon" href="assets/kit-head.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
<div class="app-frame">
  <aside class="sidebar">
    <a class="brand" href="#" aria-label="Nexus home">
      <span class="brand-mark"><span></span><span></span><span></span></span>
      <span class="brand-name">nexus<span> / deck</span></span>
    </a>
    <div class="side-label">WORKSPACE</div>
    <nav class="side-nav" aria-label="Main navigation">
      <button class="nav-item active" data-view="overview"><span class="nav-symbol">⌂</span>Overview <kbd>1</kbd></button>
      <button class="nav-item" data-view="projects"><span class="nav-symbol">◈</span>Projects <kbd>2</kbd></button>
      <button class="nav-item" data-view="tasks"><span class="nav-symbol">☷</span>Tasks <kbd>3</kbd></button>
      <button class="nav-item" data-view="notes"><span class="nav-symbol">▤</span>Notes <kbd>4</kbd></button>
    </nav>
    <div class="side-label side-label-spaced">PERSONAL</div>
    <nav class="side-nav">
      <button class="nav-item" data-view="focus"><span class="nav-symbol">◷</span>Focus <span class="nav-live"></span></button>
      <button class="nav-item" data-view="library"><span class="nav-symbol">▧</span>Library</button>
    </nav>
    <div class="sidebar-bottom">
      <div class="status-card"><span class="status-orb"></span><div><strong>All systems ready</strong><small>Your space is saved locally</small></div></div>
      <button class="profile-button" id="profileButton"><img src="assets/kit-head.svg" alt=""><span><strong>My workspace</strong><small>Personal deck</small></span><b>⌄</b></button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="breadcrumb"><span>NEXUS</span><i>/</i><strong id="crumb">OVERVIEW</strong></div>
      <div class="top-actions"><span class="date-chip" id="dateChip"></span><button class="icon-action" id="searchButton" aria-label="Search" title="Search">⌕</button><button class="new-button" id="quickCreate"><span>＋</span> New</button></div>
    </header>
    <section class="content" id="content" aria-live="polite"></section>
    <footer class="footer"><span>NEXUS DECK <i>—</i> BUILT FOR YOUR NEXT MOVE</span><span><b class="footer-dot"></b> LOCAL WORKSPACE</span></footer>
  </main>
</div>
<div class="modal-layer" id="modalLayer" aria-hidden="true"></div>
<div class="toast-stack" id="toastStack" aria-live="polite"></div>
<script src="app.js" defer></script>
</body>
</html>
