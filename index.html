<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080708">
<title>Nexus</title>
<style>
:root{color-scheme:dark;--bg:#080708;--surface:#100e11;--surface2:#151216;--line:#29232b;--muted:#958c97;--text:#f4f0f3;--red:#ed1032;--red2:#bc0929;--green:#4acb83}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #ff405e;outline-offset:2px}.hidden{display:none!important}
#login{min-height:100vh;display:grid;place-items:center;position:relative;overflow:hidden;padding:24px;background:#050405}
.login-bg{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 52%,#190509 0,#090608 44%,#030304 78%)}
.login-bg:before,.login-bg:after{content:"";position:absolute;inset:-12%;background:linear-gradient(132deg,transparent 0 14%,#40000d 14.1% 18%,transparent 18.1%);opacity:.8}
.login-bg:after{transform:scaleX(-1) rotate(8deg);background:linear-gradient(135deg,transparent 0 68%,#740018 68.1% 72%,transparent 72.1%);opacity:.85}
.login-card{position:relative;width:min(100%,490px);padding:25px 34px 24px;border:1px solid #ed102f;border-radius:22px;background:rgba(9,7,9,.92);box-shadow:0 24px 90px #000a,0 0 42px #9d001a20;display:flex;flex-direction:column;align-items:center}
.login-logo{width:138px;height:116px;object-fit:contain;margin:0 0 17px;filter:drop-shadow(0 0 15px #ee102f29)}
.login-form{width:100%;display:grid;gap:13px}
.field{height:58px;display:flex;align-items:center;gap:14px;padding:0 17px;border:1px solid #322c34;border-radius:15px;background:linear-gradient(110deg,#100d11,#0c0a0d);color:#aaa2ac;transition:border-color .18s,box-shadow .18s}
.field:focus-within{border-color:#a90b27;box-shadow:0 0 0 3px #ed102f14}.field svg{width:20px;height:20px;flex:none;stroke:#e7e1e7}.field input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:#f7f2f5;font-size:14px}.field input::placeholder{color:#817982}
.field button{border:0;background:transparent;color:#c9c1ca;padding:5px;display:grid;place-items:center}
.primary{height:58px;border:1px solid #ff1a3d;border-radius:15px;background:linear-gradient(100deg,#ef092e,#c7072b);color:#fff;font-weight:700;font-size:16px;box-shadow:0 8px 24px #c3002329;transition:filter .18s,transform .18s}.primary:hover{filter:brightness(1.12);transform:translateY(-1px)}
.admin-entry{align-self:center;margin-top:15px;padding:7px 16px;border-radius:99px;border:1px solid #332a31;background:#100d10;color:#aaa1aa;font-size:12px}.admin-entry:hover{border-color:#8c1730;color:#fff}.login-note{min-height:16px;margin-top:8px;color:#f17b8d;font-size:12px;text-align:center}
#app{min-height:100vh;display:grid;grid-template-columns:218px minmax(380px,1fr) 270px;gap:12px;padding:12px;background:radial-gradient(ellipse at 50% 0%,#16090d 0,#090708 42%,#060506 100%)}
.sidebar,.workspace,.rightbar{border:1px solid #211c21;background:rgba(10,9,10,.97);border-radius:16px;min-height:calc(100vh - 24px)}
.sidebar{display:flex;flex-direction:column;padding:15px 11px 11px;min-width:0}.brand{height:94px;display:flex;align-items:center;justify-content:center;margin:0 4px 12px;border-bottom:1px solid #211d22}.brand img{width:104px;height:82px;object-fit:contain}
.nav{display:grid;gap:5px}.nav-btn{display:flex;align-items:center;gap:13px;height:46px;padding:0 13px;border-radius:10px;border:1px solid transparent;background:transparent;color:#aaa4ad;text-align:left;font-size:13px;font-weight:570;transition:background .15s,color .15s}.nav-btn svg{width:19px;height:19px;stroke:currentColor;flex:none}.nav-btn:hover{background:#181317;color:#fff}.nav-btn.active{background:linear-gradient(100deg,#d90c2e,#a70724);border-color:#f21b3e;color:#fff;box-shadow:0 7px 20px #aa001e1f}
.sidebar-bottom{margin-top:auto;border-top:1px solid #252026;padding:12px 4px 1px}.profile{display:flex;align-items:center;gap:9px;min-width:0}.avatar{width:36px;height:36px;flex:none;border-radius:50%;display:grid;place-items:center;background:#242126;border:1px solid #454047;color:#f4edf1;font-weight:700}.profile-text{min-width:0;flex:1}.profile-name{font-size:12px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.profile-status{font-size:10px;color:#9a929a;margin-top:2px}.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px}.logout{border:0;background:transparent;color:#a69da6;padding:7px;border-radius:8px}.logout:hover{background:#21171d;color:#fff}
.workspace{display:flex;flex-direction:column;overflow:hidden;min-width:0}.topbar{height:70px;flex:none;display:flex;align-items:center;gap:16px;padding:0 22px;border-bottom:1px solid #252026}.page-title{font-size:18px;font-weight:700;letter-spacing:-.02em;flex:1}.top-actions{display:flex;align-items:center;gap:8px}.icon-btn{width:37px;height:37px;border:1px solid transparent;border-radius:9px;background:transparent;color:#bcb4bd;display:grid;place-items:center}.icon-btn:hover{background:#191418;color:#fff;border-color:#30242b}.icon-btn svg{width:18px;height:18px;stroke:currentColor}
.search{width:min(230px,26vw);height:38px;display:flex;align-items:center;gap:9px;padding:0 12px;border:1px solid #2b252c;border-radius:10px;background:#100e11;color:#a79fa8}.search svg{width:16px;height:16px;stroke:currentColor;flex:none}.search input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:#fff;font-size:12px}.search input::placeholder{color:#777079}
.demo-tag{font-size:9px;letter-spacing:.09em;color:#e88191;border:1px solid #53202d;border-radius:99px;padding:5px 8px;white-space:nowrap}
.content{padding:24px;overflow:auto;flex:1;min-height:0}.rightbar{padding:21px 16px;display:flex;flex-direction:column;gap:24px;overflow:auto}
.rail-section{display:grid;gap:12px}.rail-heading{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700}.rail-count{font-size:10px;color:#8d858e;font-weight:500}.rail-empty{padding:14px 11px;border:1px solid #211d22;background:#0d0b0e;border-radius:10px;color:#837b85;font-size:11px;line-height:1.5}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:17px}.section-head h2{font-size:15px;margin:0;font-weight:700}.section-head p{font-size:11px;color:var(--muted);margin:5px 0 0}
.outline-btn,.soft-btn,.small-red{height:37px;padding:0 13px;border-radius:9px;font-size:11px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}.outline-btn{border:1px solid #41303a;background:#100d10;color:#e9e1e7}.outline-btn:hover{border-color:#ad1735;background:#171015}.small-red{height:35px;border:1px solid #f21a3c;background:#cb092c;color:#fff}.small-red:hover{background:#ed1036}.soft-btn{border:1px solid #2b252d;background:#171317;color:#cfc7cf}.soft-btn:hover{background:#211a20;color:#fff}.outline-btn svg,.soft-btn svg,.small-red svg{width:15px;height:15px;stroke:currentColor}
.panel{border:1px solid #29232a;border-radius:13px;background:linear-gradient(145deg,#110f12,#0c0a0d);padding:18px}.muted{color:#918993}.home-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(220px,.8fr);gap:15px}
.chamber-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px}.chamber-card{min-height:126px;border:1px solid #30252d;border-radius:12px;background:linear-gradient(135deg,#171116,#0c0a0d);padding:15px;display:flex;flex-direction:column;gap:10px;text-align:left;color:#f4eef2;transition:border-color .16s,transform .16s}.chamber-card:hover{border-color:#9c1832;transform:translateY(-2px)}.chamber-symbol{width:32px;height:32px;border:1px solid #5b182a;border-radius:9px;display:grid;place-items:center;color:#ff4560;background:#220b12;font-size:14px;font-weight:750}.chamber-name{font-size:13px;font-weight:700}.chamber-meta{font-size:10px;color:#918993}
.create-card{min-height:126px;border:1px dashed #56303a;border-radius:12px;background:#100c0f;color:#d8cbd2;display:flex;align-items:center;justify-content:center;gap:11px;flex-direction:column;font-size:11px}.create-card:hover{background:#180d12;border-color:#d91a3c;color:#fff}.create-plus{width:32px;height:32px;border:1px solid #733044;border-radius:50%;display:grid;place-items:center;color:#ff526a;font-size:22px;font-weight:300}
.empty-state{min-height:225px;border:1px solid #272127;border-radius:13px;background:linear-gradient(145deg,#100d10,#0b090b);display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:25px}.empty-mark{width:49px;height:49px;border:1px solid #4a1a2a;border-radius:14px;display:grid;place-items:center;color:#ff405c;background:#1c0b11;margin-bottom:14px}.empty-mark svg{width:22px;height:22px;stroke:currentColor}.empty-state h3{font-size:14px;margin:0 0 7px}.empty-state p{font-size:11px;color:#928994;margin:0 0 15px;max-width:310px;line-height:1.5}
.tabs{display:flex;gap:6px;border-bottom:1px solid #282229;padding-bottom:12px;margin-bottom:16px;flex-wrap:wrap}.tab{height:32px;padding:0 11px;border:1px solid transparent;border-radius:8px;background:transparent;color:#9a919b;font-size:11px}.tab.active{background:#241016;border-color:#632034;color:#fff}
.row-item{display:flex;align-items:center;gap:11px;padding:12px 3px;border-bottom:1px solid #211d22}.row-item:last-child{border-bottom:0}.row-main{flex:1;min-width:0}.row-name{font-size:12px;font-weight:650}.row-sub{font-size:10px;color:#918993;margin-top:3px}
.message-layout{display:grid;grid-template-columns:225px 1fr;min-height:470px;border:1px solid #29232a;border-radius:13px;overflow:hidden}.message-list{border-right:1px solid #29232a;padding:15px;background:#0d0b0e}.message-view{display:grid;place-items:center;padding:20px}
.settings-grid{display:grid;grid-template-columns:170px 1fr;gap:14px}.settings-nav{display:grid;align-content:start;gap:4px}.settings-nav button{border:0;border-radius:8px;background:transparent;color:#a69da7;text-align:left;padding:10px;font-size:11px}.settings-nav button.active,.settings-nav button:hover{background:#1b1419;color:#fff}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid #252027}.setting-row:last-child{border:0}.setting-label{font-size:12px;font-weight:650}.setting-help{font-size:10px;color:#918993;margin-top:4px}
.channel-strip{display:flex;gap:7px;flex-wrap:wrap;border-bottom:1px solid #29232a;padding-bottom:13px;margin-bottom:14px}.channel-pill{height:32px;padding:0 12px;border:1px solid #302832;border-radius:8px;background:#100d11;color:#a9a0aa;font-size:11px}.channel-pill.active{border-color:#82233b;background:#251016;color:#fff}
.chamber-room{border:1px solid #29232a;border-radius:13px;background:#0d0b0e;display:flex;flex-direction:column;min-height:420px;overflow:hidden}.room-top{height:55px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #282229}.room-top strong{font-size:12px}.room-top span{font-size:10px;color:#8e858f}.chat-feed{flex:1;min-height:220px;max-height:calc(100vh - 360px);overflow:auto;padding:17px;display:flex;flex-direction:column;gap:13px}.chat-empty{margin:auto;text-align:center;color:#827a84;font-size:11px}.chat-line{display:flex;gap:10px;align-items:flex-start}.chat-avatar{width:30px;height:30px;border:1px solid #4e2633;border-radius:9px;background:#211017;color:#ff647c;display:grid;place-items:center;font-size:10px;font-weight:750;flex:none}.chat-copy{min-width:0;flex:1}.chat-meta{display:flex;align-items:center;gap:8px;margin:1px 0 4px}.chat-meta b{font-size:11px}.chat-meta time{font-size:9px;color:#77707a}.chat-body{font-size:12px;line-height:1.55;color:#ddd5dc;white-space:pre-wrap;overflow-wrap:anywhere}.chat-compose{display:flex;gap:8px;padding:12px;border-top:1px solid #282229;background:#100d10}.chat-compose input{height:41px;flex:1;min-width:0;border:1px solid #342d36;border-radius:9px;background:#090809;padding:0 12px;color:#fff;outline:0;font-size:12px}.chat-compose input:focus{border-color:#9d1a37}.pending-cancel{border:1px solid #3a3039;background:#151116;color:#bdb4be;border-radius:8px;padding:7px 10px;font-size:10px}.pending-cancel:hover{border-color:#8a223a;color:#fff}
.modal-backdrop{position:fixed;inset:0;z-index:30;background:#000b;display:grid;place-items:center;padding:18px;backdrop-filter:blur(5px)}.modal{width:min(100%,430px);border:1px solid #6c1930;border-radius:15px;background:#100d10;box-shadow:0 25px 80px #000;padding:21px}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.modal-head h3{font-size:16px;margin:0}.modal-close{border:0;background:transparent;color:#a89eaa;font-size:22px}.modal label{display:block;font-size:10px;color:#b9b0ba;margin:13px 0 6px}.modal input,.modal textarea{width:100%;border:1px solid #342d36;border-radius:8px;background:#0a090b;padding:11px;color:#fff;outline:0;font-size:12px}.modal textarea{resize:vertical;min-height:72px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toast{position:fixed;z-index:40;left:50%;bottom:22px;transform:translateX(-50%);padding:10px 15px;border:1px solid #5a2031;border-radius:9px;background:#171014;color:#f6e9ef;font-size:11px;box-shadow:0 10px 35px #000;max-width:calc(100vw - 30px)}
@media(max-width:1080px){#app{grid-template-columns:205px minmax(0,1fr)}.rightbar{display:none}.home-grid{grid-template-columns:1fr}}
@media(max-width:700px){#app{display:block;padding:0;min-height:100vh}.sidebar{position:fixed;z-index:10;left:0;right:0;bottom:0;height:64px;min-height:0;border-radius:14px 14px 0 0;padding:5px 8px;background:#0d0a0d;display:block}.brand,.sidebar-bottom{display:none}.nav{height:100%;display:flex;justify-content:space-around;align-items:center;gap:2px}.nav-btn{height:49px;min-width:48px;justify-content:center;padding:0 6px;gap:0;flex:1;flex-direction:column;font-size:9px}.nav-btn svg{width:18px;height:18px}.workspace{min-height:calc(100vh - 72px);border-radius:0;border:0}.topbar{height:61px;padding:0 13px}.content{padding:17px 12px 26px}.search{width:38px;padding:0;justify-content:center}.search input{display:none}.top-actions{gap:1px}.page-title{font-size:16px}.login-card{padding:22px 18px}.login-logo{height:100px;margin-bottom:12px}.message-layout{grid-template-columns:1fr;min-height:400px}.message-list{display:none}.settings-grid{grid-template-columns:1fr}.settings-nav{display:flex;overflow:auto}.settings-nav button{white-space:nowrap}.chamber-grid{grid-template-columns:1fr}.section-head{align-items:flex-start}.section-head .outline-btn{flex:none}.chat-feed{max-height:none}}
</style>
</head>
<body>
<section id="login">
  <div class="login-bg"></div>
  <div class="login-card">
    <img class="login-logo" src="assets/nexus-mark.svg" alt="Nexus">
    <form class="login-form" id="loginForm">
      <div class="field"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c.6-4.1 3.3-6 8-6s7.4 1.9 8 6"/></svg><input id="loginUser" autocomplete="username" placeholder="Username or Email" aria-label="Username or Email"></div>
      <div class="field"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg><input id="loginPassword" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password"><button type="button" id="togglePassword" aria-label="Show password"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
      <button class="primary" type="submit">Log In</button>
    </form>
    <button class="admin-entry" id="adminEntry" type="button">Admin</button>
    <div class="login-note" id="loginNote" aria-live="polite"></div>
  </div>
</section>
<section id="app" class="hidden" aria-label="Nexus preview">
  <aside class="sidebar">
    <div class="brand"><img src="assets/nexus-mark.svg" alt="Nexus"></div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-bottom"><div class="profile"><div class="avatar" id="profileInitial">A</div><div class="profile-text"><div class="profile-name" id="profileName">Admin Preview</div><div class="profile-status"><span class="status-dot"></span>Preview mode</div></div><button class="logout" id="exitPreview" title="Exit preview" aria-label="Exit preview"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"/></svg></button></div></div>
  </aside>
  <main class="workspace">
    <header class="topbar"><div class="page-title" id="pageTitle">Home</div><div class="top-actions"><span class="demo-tag">PREVIEW</span><button class="icon-btn" id="requestsQuick" title="Friend requests" aria-label="Friend requests"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M16 11h6"/></svg></button><label class="search"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="7"/><path d="m16 16 5 5"/></svg><input id="globalSearch" placeholder="Search" aria-label="Search Nexus"></label></div></header>
    <div class="content" id="content"></div>
  </main>
  <aside class="rightbar" id="rightbar"></aside>
</section>
<div id="modalRoot"></div><div id="toastRoot" aria-live="polite"></div>
<script>
(function(){
"use strict";
var $=function(sel,root){return (root||document).querySelector(sel)};
var icons={
home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
friends:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M20 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
chambers:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
messages:'<path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 9 9 0 0 1-4-.9L3 21l1.9-5.5a9 9 0 0 1-.9-4A8.5 8.5 0 0 1 12.5 3h.5a8.5 8.5 0 0 1 8 8z"/>',
settings:'<circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.3 1-1.3 2.2-1.6-.6a8 8 0 0 1-1.5.9l-.3 1.7h-2.6l-.3-1.7a8 8 0 0 1-1.5-.9l-1.6.6-1.3-2.2 1.3-1a8 8 0 0 1 0-1.8l-1.3-1 1.3-2.2 1.6.6a8 8 0 0 1 1.5-.9l.3-1.7h2.6l.3 1.7a8 8 0 0 1 1.5.9l1.6-.6 1.3 2.2-1.3 1a8 8 0 0 1 0 1.8z"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
search:'<circle cx="10.8" cy="10.8" r="7"/><path d="m16 16 5 5"/>',
chat:'<path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 9 9 0 0 1-4-.9L3 21l1.9-5.5a9 9 0 0 1-.9-4A8.5 8.5 0 0 1 12.5 3h.5a8.5 8.5 0 0 1 8 8z"/>',
compass:'<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2.2 4.8-4.8 2.2 2.2-4.8z"/>'
};
function ico(name){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(icons[name]||icons.home)+'</svg>'}
function esc(value){return String(value).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]})}
function read(key,fallback){try{var v=JSON.parse(localStorage.getItem('nexus-preview-'+key));return Array.isArray(v)?v:(fallback||[])}catch(e){return fallback||[]}}
function write(key,value){try{localStorage.setItem('nexus-preview-'+key,JSON.stringify(value));return true}catch(e){showToast('Browser storage is full or unavailable');return false}}
var chambers=read('chambers'),outgoing=read('requests'),chamberMessages=read('messages');
var activePage='home',friendTab='all',chamberView='mine',selectedChamber=null,selectedChannel='general',searchQuery='';
var profileName=localStorage.getItem('nexus-preview-profile')||'Admin Preview';
var navItems=[['home','Home','home'],['friends','Friends','friends'],['chambers','Chambers','chambers'],['messages','Messages','messages'],['settings','Settings','settings']];
function showToast(message){var root=$('#toastRoot');root.innerHTML='<div class="toast">'+esc(message)+'</div>';window.clearTimeout(showToast.timer);showToast.timer=window.setTimeout(function(){root.innerHTML=''},2500)}
function enterPreview(){if(!localStorage.getItem('nexus-preview-seen')){localStorage.setItem('nexus-preview-seen','1')}$('#login').classList.add('hidden');$('#app').classList.remove('hidden');renderApp()}
function exitPreview(){$('#app').classList.add('hidden');$('#login').classList.remove('hidden');$('#loginNote').textContent=''}
$('#adminEntry').addEventListener('click',enterPreview);
$('#exitPreview').addEventListener('click',exitPreview);
$('#loginForm').addEventListener('submit',function(event){event.preventDefault();$('#loginNote').textContent='Live sign-in is not connected yet.'});
$('#togglePassword').addEventListener('click',function(){var input=$('#loginPassword');input.type=input.type==='password'?'text':'password';this.setAttribute('aria-label',input.type==='password'?'Show password':'Hide password')});
function renderNav(){$('#nav').innerHTML=navItems.map(function(item){return '<button class="nav-btn '+(activePage===item[0]?'active':'')+'" data-page="'+item[0]+'">'+ico(item[2])+'<span>'+item[1]+'</span></button>'}).join('')}
function emptyState(mark,title,description,button,action){return '<div class="empty-state"><div class="empty-mark">'+ico(mark)+'</div><h3>'+title+'</h3><p>'+description+'</p>'+(button?'<button class="small-red" data-action="'+action+'">'+ico('plus')+button+'</button>':'')+'</div>'}
function chamberCard(chamber){var count=Array.isArray(chamber.channels)?chamber.channels.length:2;return '<button class="chamber-card" data-chamber="'+esc(chamber.id)+'"><span class="chamber-symbol">'+esc((chamber.name||'C').trim().slice(0,1).toUpperCase())+'</span><span class="chamber-name">'+esc(chamber.name)+'</span><span class="chamber-meta">'+count+' channels - Your Chamber</span></button>'}
function renderRail(){
var sent=outgoing.length;
$('#rightbar').innerHTML='<section class="rail-section"><div class="rail-heading"><span>Friend requests</span><span class="rail-count">'+sent+' sent</span></div><div class="rail-empty">'+(sent?sent+' outgoing preview request'+(sent===1?'':'s')+'.':'No pending requests.')+'</div><button class="soft-btn" data-page="friends">Open Friends</button></section><section class="rail-section"><div class="rail-heading"><span>Online friends</span><span class="rail-count">0 online</span></div><div class="rail-empty">No friends online yet.</div></section>';
}
function renderHome(){
var chamberContent=chambers.length?'<div class="chamber-grid">'+chambers.slice(0,2).map(chamberCard).join('')+'</div>':emptyState('chambers','No Chambers yet','Create a Chamber for the people you want to bring together.','Create Chamber','create-chamber');
return '<div class="home-grid"><section><div class="section-head"><div><h2>Your Chambers</h2><p>Spaces you have joined</p></div><button class="outline-btn" data-page="chambers">View all</button></div>'+chamberContent+'</section><section><div class="section-head"><div><h2>Friends</h2><p>Your connections</p></div><button class="outline-btn" data-page="friends">Open</button></div><div class="panel" style="min-height:142px;display:flex;align-items:center;justify-content:center;text-align:center"><div><div class="muted" style="font-size:11px;margin-bottom:12px">No friends added yet</div><button class="small-red" data-action="add-friend">'+ico('plus')+'Add Friend</button></div></div></section><section style="grid-column:1/-1"><div class="section-head"><div><h2>Recent activity</h2></div></div><div class="panel muted" style="font-size:11px">Nothing new</div></section></div>';
}
function renderChamberDetail(chamber){
if(!Array.isArray(chamber.channels)||!chamber.channels.length)chamber.channels=['general','announcements'];
if(!chamber.channels.includes(selectedChannel))selectedChannel=chamber.channels[0];
var messages=chamberMessages.filter(function(message){return message.chamberId===chamber.id&&message.channel===selectedChannel});
var tabs=chamber.channels.map(function(channel){return '<button class="channel-pill '+(channel===selectedChannel?'active':'')+'" data-channel="'+esc(channel)+'"># '+esc(channel)+'</button>'}).join('');
var feed=messages.length?messages.map(function(message){var date=new Date(message.createdAt);var stamp=isNaN(date.getTime())?'':date.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});return '<article class="chat-line"><div class="chat-avatar">'+esc((message.author||'A').slice(0,1).toUpperCase())+'</div><div class="chat-copy"><div class="chat-meta"><b>'+esc(message.author||profileName)+'</b><time>'+esc(stamp)+'</time></div><div class="chat-body">'+esc(message.body)+'</div></div></article>'}).join(''):'<div class="chat-empty">No messages here yet</div>';
return '<div class="section-head"><div><h2>'+esc(chamber.name)+'</h2><p>'+esc(chamber.description||'Your Chamber')+'</p></div><div style="display:flex;gap:8px"><button class="outline-btn" data-action="manage-chamber">Manage</button><button class="outline-btn" data-action="create-channel">'+ico('plus')+'Channel</button><button class="outline-btn" data-action="back-chambers">Back</button></div></div><div class="channel-strip">'+tabs+'</div><section class="chamber-room"><div class="room-top"><strong># '+esc(selectedChannel)+'</strong><span>'+messages.length+' messages</span></div><div class="chat-feed" id="chatFeed">'+feed+'</div><form class="chat-compose" id="chatForm"><input id="chatMessage" maxlength="1200" autocomplete="off" required placeholder="Message # '+esc(selectedChannel)+'" aria-label="Message '+esc(selectedChannel)+'"><button class="small-red" type="submit">Send</button></form></section>';
}
function renderChambers(){
if(selectedChamber){var selected=chambers.find(function(chamber){return chamber.id===selectedChamber});if(selected)return renderChamberDetail(selected);selectedChamber=null}
var shown=chambers.filter(function(chamber){var q=searchQuery.toLowerCase();return !q||chamber.name.toLowerCase().includes(q)||(chamber.description||'').toLowerCase().includes(q)||(chamber.channels||[]).some(function(channel){return channel.toLowerCase().includes(q)})});
var cards=shown.length?'<div class="chamber-grid">'+shown.map(chamberCard).join('')+(searchQuery?'':'<button class="create-card" data-action="create-chamber"><span class="create-plus">+</span>Create Chamber</button>')+'</div>':searchQuery?emptyState('search','No Chambers found','Try a different name, description, or channel.','',''):emptyState('chambers','No Chambers yet','Your Chambers will appear here.','Create Chamber','create-chamber');
return '<div class="section-head"><div><h2>Chambers</h2><p>Your communities, all in one place</p></div><button class="small-red" data-action="create-chamber">'+ico('plus')+'Create Chamber</button></div><div class="tabs"><button class="tab '+(chamberView==='mine'?'active':'')+'" data-chamber-tab="mine">Your Chambers</button><button class="tab '+(chamberView==='discover'?'active':'')+'" data-chamber-tab="discover">Discover</button></div>'+(chamberView==='mine'?cards:emptyState('compass','Nothing to explore yet','Public Chambers will appear here when discovery is connected.','',''));
}
function renderFriends(){
var body;
if(friendTab==='requests'){body=outgoing.length?outgoing.map(function(request){return '<div class="row-item"><div class="avatar">'+esc(request.name.slice(0,1).toUpperCase())+'</div><div class="row-main"><div class="row-name">'+esc(request.name)+'</div><div class="row-sub">Preview request - saved locally</div></div><button class="pending-cancel" data-cancel-request="'+esc(request.id)+'">Cancel</button></div>'}).join(''):'<div class="rail-empty">No friend requests.</div>'}
else{body=emptyState('friends','No friends yet','Add someone by their username to start building your friends list.','Add Friend','add-friend')}
return '<div class="section-head"><div><h2>Friends</h2><p>Manage your connections</p></div><button class="small-red" data-action="add-friend">'+ico('plus')+'Add Friend</button></div><div class="tabs"><button class="tab '+(friendTab==='all'?'active':'')+'" data-friend-tab="all">All Friends</button><button class="tab '+(friendTab==='requests'?'active':'')+'" data-friend-tab="requests">Requests'+(outgoing.length?' ('+outgoing.length+')':'')+'</button></div><div class="panel">'+body+'</div>';
}
function renderMessages(){return '<div class="section-head"><div><h2>Messages</h2><p>Direct conversations</p></div><button class="outline-btn" data-page="friends">Find a friend</button></div><div class="message-layout"><div class="message-list"><div class="search" style="width:100%">'+ico('search')+'<input placeholder="Find a conversation" aria-label="Find a conversation"></div><div class="rail-empty" style="margin-top:14px">No conversations yet</div></div><div class="message-view">'+emptyState('chat','No messages yet','Direct conversations will appear here after you add friends.','Find Friends','friends')+'</div></div>'}
function renderSettings(){return '<div class="section-head"><div><h2>Settings</h2><p>Preview preferences</p></div></div><div class="settings-grid"><div class="settings-nav"><button class="active">My Account</button><button>Appearance</button><button>Privacy</button></div><div class="panel"><div class="setting-row"><div><div class="setting-label">Display name</div><div class="setting-help">'+esc(profileName)+'</div></div><button class="outline-btn" data-action="edit-profile">Edit</button></div><div class="setting-row"><div><div class="setting-label">Theme</div><div class="setting-help">Dark - Crimson</div></div><span class="demo-tag">CURRENT</span></div><div class="setting-row"><div><div class="setting-label">Authentication</div><div class="setting-help">Real accounts will be connected after the preview.</div></div><span class="demo-tag">NOT CONNECTED</span></div><div class="setting-row"><div><div class="setting-label">Preview data</div><div class="setting-help">Chambers and messages are saved only in this browser.</div></div><button class="soft-btn" data-action="clear-preview">Clear</button></div></div></div>'}
function renderApp(){
renderNav();
$('#pageTitle').textContent=navItems.find(function(item){return item[0]===activePage})[1];
$('#profileName').textContent=profileName;
$('#profileInitial').textContent=(profileName.trim()[0]||'A').toUpperCase();
var view=activePage==='home'?renderHome():activePage==='friends'?renderFriends():activePage==='chambers'?renderChambers():activePage==='messages'?renderMessages():renderSettings();
$('#content').innerHTML=view;
renderRail();
}
function openModal(kind){
var html='';
if(kind==='chamber')html='<div class="modal-backdrop" data-close-modal><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h3 id="modalTitle">Create a Chamber</h3><button class="modal-close" data-close-modal aria-label="Close">×</button></div><form id="chamberForm"><label for="chamberName">Chamber name</label><input id="chamberName" maxlength="32" required placeholder="Name your Chamber"><label for="chamberDescription">Description (optional)</label><textarea id="chamberDescription" maxlength="120" placeholder="What is this Chamber for?"></textarea><div class="modal-actions"><button type="button" class="soft-btn" data-close-modal>Cancel</button><button class="small-red" type="submit">Create Chamber</button></div></form></div></div>';
if(kind==='friend')html='<div class="modal-backdrop" data-close-modal><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h3 id="modalTitle">Add a Friend</h3><button class="modal-close" data-close-modal aria-label="Close">×</button></div><form id="friendForm"><label for="friendName">Username</label><input id="friendName" maxlength="24" required placeholder="Enter a username"><div class="modal-actions"><button type="button" class="soft-btn" data-close-modal>Cancel</button><button class="small-red" type="submit">Send Request</button></div></form></div></div>';
if(kind==='channel')html='<div class="modal-backdrop" data-close-modal><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h3 id="modalTitle">Add a Channel</h3><button class="modal-close" data-close-modal aria-label="Close">×</button></div><form id="channelForm"><label for="channelName">Channel name</label><input id="channelName" maxlength="28" required placeholder="e.g. projects"><div class="modal-actions"><button type="button" class="soft-btn" data-close-modal>Cancel</button><button class="small-red" type="submit">Add Channel</button></div></form></div></div>';
if(kind==='manage-chamber'){var current=chambers.find(function(item){return item.id===selectedChamber});if(current)html='<div class="modal-backdrop" data-close-modal><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h3 id="modalTitle">Chamber settings</h3><button class="modal-close" data-close-modal aria-label="Close">×</button></div><form id="editChamberForm"><label for="editChamberName">Name</label><input id="editChamberName" maxlength="32" required value="'+esc(current.name)+'"><label for="editChamberDescription">Description</label><textarea id="editChamberDescription" maxlength="120">'+esc(current.description||'')+'</textarea><div class="modal-actions" style="justify-content:space-between"><button type="button" class="pending-cancel" data-action="delete-current-chamber">Delete Chamber</button><span style="display:flex;gap:8px"><button type="button" class="soft-btn" data-close-modal>Cancel</button><button class="small-red" type="submit">Save</button></span></div></form></div></div>'}
if(kind==='profile')html='<div class="modal-backdrop" data-close-modal><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h3 id="modalTitle">Edit display name</h3><button class="modal-close" data-close-modal aria-label="Close">×</button></div><form id="profileForm"><label for="displayName">Display name</label><input id="displayName" maxlength="24" required value="'+esc(profileName)+'"><div class="modal-actions"><button type="button" class="soft-btn" data-close-modal>Cancel</button><button class="small-red" type="submit">Save</button></div></form></div></div>';
$('#modalRoot').innerHTML=html;
var field=kind==='chamber'?'#chamberName':kind==='friend'?'#friendName':kind==='channel'?'#channelName':kind==='manage-chamber'?'#editChamberName':'#displayName';
if($(field))$(field).focus();
}
function closeModal(){$('#modalRoot').innerHTML=''}
function clearPreview(){
if(!confirm('Clear the Chambers, messages, and outgoing requests saved in this browser?'))return;
chambers=[];outgoing=[];chamberMessages=[];
write('chambers',chambers);write('requests',outgoing);write('messages',chamberMessages);
selectedChamber=null;renderApp();showToast('Preview data cleared');
}
document.addEventListener('click',function(event){
var nav=event.target.closest('[data-page]');
if(nav){var page=nav.dataset.page;if(page==='friends'&&nav.dataset.action==='friends')friendTab='all';activePage=page;selectedChamber=null;renderApp();return}
var action=event.target.closest('[data-action]');
if(action){
var name=action.dataset.action;
if(name==='create-chamber')openModal('chamber');
if(name==='add-friend')openModal('friend');
if(name==='create-channel')openModal('channel');
if(name==='manage-chamber')openModal('manage-chamber');
if(name==='edit-profile')openModal('profile');
if(name==='delete-current-chamber'){var doomed=selectedChamber;if(doomed&&confirm('Delete this Chamber and its preview messages?')){chambers=chambers.filter(function(item){return item.id!==doomed});chamberMessages=chamberMessages.filter(function(message){return message.chamberId!==doomed});write('chambers',chambers);write('messages',chamberMessages);selectedChamber=null;closeModal();renderApp();showToast('Chamber deleted from this preview')}}
if(name==='clear-preview')clearPreview();
if(name==='back-chambers'){selectedChamber=null;renderApp()}
if(name==='friends'){activePage='friends';renderApp()}
return;
}
var chamber=event.target.closest('[data-chamber]');
if(chamber){selectedChamber=chamber.dataset.chamber;selectedChannel='general';activePage='chambers';renderApp();return}
var friendTabButton=event.target.closest('[data-friend-tab]');
if(friendTabButton){friendTab=friendTabButton.dataset.friendTab;renderApp();return}
var chamberTabButton=event.target.closest('[data-chamber-tab]');
if(chamberTabButton){chamberView=chamberTabButton.dataset.chamberTab;selectedChamber=null;renderApp();return}
var channelButton=event.target.closest('[data-channel]');
if(channelButton){selectedChannel=channelButton.dataset.channel;renderApp();return}
var cancel=event.target.closest('[data-cancel-request]');
if(cancel){outgoing=outgoing.filter(function(request){return request.id!==cancel.dataset.cancelRequest});write('requests',outgoing);renderApp();showToast('Request removed from preview');return}
if(event.target.matches('[data-close-modal]'))closeModal();
});
document.addEventListener('submit',function(event){
if(event.target.id==='chamberForm'){
event.preventDefault();
var name=$('#chamberName').value.trim();
if(!name)return;
if(chambers.some(function(chamber){return chamber.name.toLowerCase()===name.toLowerCase()})){showToast('A Chamber with that name already exists');return}
var chamber={id:String(Date.now()),name:name,description:$('#chamberDescription').value.trim(),channels:['general','announcements']};
chambers.unshift(chamber);write('chambers',chambers);closeModal();selectedChamber=chamber.id;selectedChannel='general';activePage='chambers';chamberView='mine';renderApp();showToast('Chamber created in this preview');
}
if(event.target.id==='friendForm'){
event.preventDefault();
var username=$('#friendName').value.trim().replace(/^@/,'');
if(!username)return;
if(outgoing.some(function(request){return request.name.toLowerCase()===username.toLowerCase()})){showToast('Request already exists');return}
outgoing.unshift({name:username,id:String(Date.now())});write('requests',outgoing);closeModal();activePage='friends';friendTab='requests';renderApp();showToast('Preview request added');
}
if(event.target.id==='editChamberForm'){event.preventDefault();var current=chambers.find(function(item){return item.id===selectedChamber});var nextName=$('#editChamberName').value.trim();if(!current||!nextName)return;if(chambers.some(function(item){return item.id!==current.id&&item.name.toLowerCase()===nextName.toLowerCase()})){showToast('Another Chamber already uses that name');return}current.name=nextName;current.description=$('#editChamberDescription').value.trim();write('chambers',chambers);closeModal();renderApp();showToast('Chamber updated');}
if(event.target.id==='channelForm'){
event.preventDefault();
var raw=$('#channelName').value.trim().toLowerCase();
var channel=raw.replace(/[^a-z0-9_-]+/g,'-').replace(/^-+|-+$/g,'').slice(0,28);
var chamber=chambers.find(function(item){return item.id===selectedChamber});
if(!chamber||!channel){showToast('Enter a valid channel name');return}
chamber.channels=Array.isArray(chamber.channels)?chamber.channels:['general','announcements'];
if(chamber.channels.includes(channel)){showToast('That channel already exists');return}
chamber.channels.push(channel);write('chambers',chambers);selectedChannel=channel;closeModal();renderApp();showToast('Channel added');
}
if(event.target.id==='profileForm'){
event.preventDefault();
var next=$('#displayName').value.trim();
if(!next)return;
profileName=next;
try{localStorage.setItem('nexus-preview-profile',profileName)}catch(e){}
closeModal();renderApp();showToast('Preview profile updated');
}
if(event.target.id==='chatForm'){
event.preventDefault();
var body=$('#chatMessage').value.trim();
if(!body||!selectedChamber)return;
chamberMessages.push({id:String(Date.now()),chamberId:selectedChamber,channel:selectedChannel,author:profileName,body:body,createdAt:new Date().toISOString()});
write('messages',chamberMessages);renderApp();
var feed=$('#chatFeed');if(feed)feed.scrollTop=feed.scrollHeight;
}
});
document.addEventListener('keydown',function(event){if(event.key==='Escape'&&$('#modalRoot').innerHTML)closeModal()});
$('#requestsQuick').addEventListener('click',function(){activePage='friends';friendTab='requests';renderApp()});
$('#globalSearch').addEventListener('keydown',function(event){
if(event.key!=='Enter')return;
searchQuery=this.value.trim();activePage='chambers';selectedChamber=null;chamberView='mine';renderApp();
});
$('#globalSearch').addEventListener('input',function(){
if(!this.value.trim()&&searchQuery){searchQuery='';if(activePage==='chambers'&&!selectedChamber)renderApp()}
});
})();
</script>
</body>
</html>
