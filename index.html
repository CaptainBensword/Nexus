<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101013">
  <meta name="description" content="Nexus is a calm workspace for projects, tasks and ideas">
  <title>Nexus — Project workspace</title>
  <link rel="icon" href="assets/nexus-symbol.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-frame">
    <aside class="sidebar">
      <a class="brand" href="#" aria-label="Nexus home" data-view="home">
        <img src="assets/nexus-symbol.svg" alt="" class="brand-symbol">
        <span class="brand-word">NEXUS</span>
      </a>
      <div class="sidebar-caption">YOUR WORKSPACE</div>
      <nav class="nav-list" aria-label="Main navigation">
        <button class="nav-link active" data-view="home"><span class="nav-icon icon-home"></span><span>Home</span></button>
        <button class="nav-link" data-view="projects"><span class="nav-icon icon-projects"></span><span>Projects</span><span class="nav-count" id="projectCount">0</span></button>
        <button class="nav-link" data-view="tasks"><span class="nav-icon icon-tasks"></span><span>Tasks</span><span class="nav-count" id="taskCount">0</span></button>
        <button class="nav-link" data-view="notes"><span class="nav-icon icon-notes"></span><span>Notes</span></button>
      </nav>
      <div class="sidebar-caption secondary-caption">PERSONAL</div>
      <nav class="nav-list">
        <button class="nav-link" data-view="focus"><span class="nav-icon icon-focus"></span><span>Focus timer</span></button>
        <button class="nav-link" data-view="settings"><span class="nav-icon icon-settings"></span><span>Workspace</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="storage-chip"><span class="storage-dot"></span><span><strong>Saved on this device</strong><small>No account needed</small></span></div>
        <button class="help-link" id="replayTour"><span class="help-icon">?</span> Quick tour</button>
        <div class="sidebar-foot"><span class="tiny-mark"></span> NEXUS WORKSPACE</div>
      </div>
    </aside>
    <main class="main-shell">
      <header class="topbar">
        <div class="topbar-left">
          <div class="crumb">NEXUS <span>/</span> <strong id="crumbName">HOME</strong></div>
          <div class="mobile-brand"><img src="assets/nexus-symbol.svg" alt="">NEXUS</div>
        </div>
        <div class="topbar-actions">
          <div class="today-date" id="todayDate"></div>
          <button class="search-button" id="searchButton" aria-label="Search workspace"><span>⌕</span><span class="search-label">Search</span><kbd>⌘ K</kbd></button>
          <button class="add-button" id="addButton"><span>＋</span> Add new</button>
        </div>
      </header>
      <section id="content" class="page-content" aria-live="polite"></section>
      <footer class="main-footer"><span>YOUR SPACE, YOUR PACE</span><span id="saveStatus"><i></i> ALL CHANGES SAVED</span></footer>
    </main>
  </div>
  <div class="modal-layer" id="modalLayer" aria-hidden="true"></div>
  <div class="toast-stack" id="toastStack" aria-live="polite"></div>
  <script src="app.js" defer></script>
</body>
</html>
