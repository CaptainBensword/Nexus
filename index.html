<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#171619">
  <meta name="description" content="Nexus — a quiet place to focus, plan and get things done">
  <title>Nexus — Focus workspace</title>
  <link rel="icon" href="assets/nexus-symbol.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-frame">
    <aside class="sidebar">
      <a class="brand" href="#" aria-label="Nexus focus" data-view="home">
        <img src="assets/nexus-symbol.svg" alt="" class="brand-symbol">
        <span class="brand-word">NEXUS</span>
      </a>
      <div class="sidebar-caption">WORKSPACE</div>
      <nav class="nav-list" aria-label="Main navigation">
        <button class="nav-link active" data-view="home"><span class="nav-icon icon-focus"></span><span>Focus</span></button>
        <button class="nav-link" data-view="projects"><span class="nav-icon icon-projects"></span><span>Projects</span><span class="nav-count" id="projectCount">0</span></button>
        <button class="nav-link" data-view="tasks"><span class="nav-icon icon-tasks"></span><span>Tasks</span><span class="nav-count" id="taskCount">0</span></button>
        <button class="nav-link" data-view="notes"><span class="nav-icon icon-notes"></span><span>Notes</span></button>
      </nav>
      <div class="sidebar-caption secondary-caption">PREFERENCES</div>
      <nav class="nav-list" aria-label="Preferences">
        <button class="nav-link" data-view="settings"><span class="nav-icon icon-settings"></span><span>Settings</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="storage-chip"><span class="storage-dot"></span><span><strong>Saved on this device</strong><small>No account needed</small></span></div>
        <div class="sidebar-foot"><span class="tiny-mark"></span> NEXUS WORKSPACE</div>
      </div>
    </aside>
    <main class="main-shell">
      <header class="topbar">
        <div class="topbar-left">
          <div class="crumb">NEXUS <span>/</span> <strong id="crumbName">FOCUS</strong></div>
          <div class="mobile-brand"><img src="assets/nexus-symbol.svg" alt="">NEXUS</div>
        </div>
        <div class="topbar-actions">
          <div class="today-date" id="todayDate"></div>
          <div class="running-timer" id="runningTimer" hidden><span class="running-dot"></span><span id="runningTimerValue">25:00</span><span class="running-label">FOCUS</span><button id="persistentTimerToggle" data-timer-toggle>Pause</button></div>
          <div class="ambience-wrap">
            <button class="ambience-button" id="ambienceButton" aria-expanded="false" aria-controls="ambiencePanel">
              <span class="ambience-mark"><i></i><i></i><i></i></span><span>Sound</span><span class="ambience-status" id="ambienceButtonStatus">Off</span>
            </button>
            <section class="ambience-panel" id="ambiencePanel" aria-label="Ambient sound controls" hidden>
              <div class="ambience-panel-head">
                <div><strong>Ambient sound</strong><small id="ambienceDescription">Off · Soft rain</small></div>
                <button class="ambience-play" id="ambiencePlay">Play</button>
              </div>
              <div class="scene-grid" role="group" aria-label="Choose a sound">
                <button class="scene-button active" data-scene="rain"><span class="scene-symbol rain-symbol"></span><span>Rain</span></button>
                <button class="scene-button" data-scene="brown"><span class="scene-symbol brown-symbol"></span><span>Brown noise</span></button>
                <button class="scene-button" data-scene="wind"><span class="scene-symbol wind-symbol"></span><span>Wind</span></button>
                <button class="scene-button" data-scene="fire"><span class="scene-symbol fire-symbol"></span><span>Fireplace</span></button>
              </div>
              <label class="volume-control"><span>Volume</span><input id="ambienceVolume" type="range" min="0" max="100" value="38"><output id="ambienceVolumeValue">38%</output></label>
              <p class="ambience-hint">Sound starts when you press Play and keeps running as you move around Nexus</p>
            </section>
          </div>
          <button class="search-button" id="searchButton" aria-label="Search workspace"><span>⌕</span><span class="search-label">Search</span><kbd>Ctrl K</kbd></button>
          <button class="add-button" id="addButton"><span>＋</span> Add new</button>
        </div>
      </header>
      <section id="content" class="page-content" aria-live="polite"></section>
      <footer class="main-footer"><span>NEXUS · FOCUS WORKSPACE</span><span id="saveStatus"><i></i> SAVED ON THIS DEVICE</span></footer>
    </main>
  </div>
  <div class="modal-layer" id="modalLayer" aria-hidden="true"></div>
  <div class="toast-stack" id="toastStack" aria-live="polite"></div>
  <script src="app.js" defer></script>
</body>
</html>
