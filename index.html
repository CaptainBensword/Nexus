<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080708">
<title>Nexus</title>
<style>
:root{color-scheme:dark;--bg:#080708;--panel:#100e10;--panel2:#151215;--line:#282328;--muted:#969097;--text:#f5f2f4;--red:#ed102f;--red2:#b90825;--green:#39c779;--amber:#e6ad42}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #ff3450;outline-offset:2px}
.hidden{display:none!important}
#login{min-height:100vh;display:grid;place-items:center;position:relative;overflow:hidden;padding:28px;background:#050405}
.login-bg{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 52%,#190509 0%,#090608 43%,#030304 76%);overflow:hidden}
.login-bg:before,.login-bg:after{content:"";position:absolute;inset:-12%;background:linear-gradient(132deg,transparent 0 14%,#40000d 14.1% 18%,transparent 18.1% 100%);opacity:.8}
.login-bg:after{transform:scaleX(-1) rotate(8deg);background:linear-gradient(135deg,transparent 0 68%,#740018 68.1% 72%,transparent 72.1% 100%);opacity:.85}
.login-card{position:relative;width:min(100%,560px);padding:28px 38px 30px;border:1px solid #ed102f;border-radius:23px;background:rgba(9,7,9,.88);box-shadow:0 0 0 1px rgba(237,16,47,.06),0 24px 90px rgba(0,0,0,.5),0 0 45px rgba(157,0,26,.12);display:flex;flex-direction:column;align-items:center}
.login-logo{width:148px;height:126px;object-fit:contain;margin:0 0 20px;filter:drop-shadow(0 0 15px rgba(238,16,47,.16))}
.login-form{width:100%;display:grid;gap:14px}
.field{height:61px;display:flex;align-items:center;gap:15px;padding:0 18px;border:1px solid #322c34;border-radius:17px;background:linear-gradient(110deg,#100d11,#0c0a0d);color:#aaa2ac;transition:border-color .18s,box-shadow .18s}
.field:focus-within{border-color:#a90b27;box-shadow:0 0 0 3px rgba(237,16,47,.08)}
.field svg{width:21px;height:21px;flex:none;stroke:#e7e1e7}
.field input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:#f7f2f5;font-size:15px}
.field input::placeholder{color:#817982}
.field button{border:0;background:transparent;color:#c9c1ca;padding:5px;display:grid;place-items:center}
.primary{height:62px;border:1px solid #ff1a3d;border-radius:17px;background:linear-gradient(100deg,#ef092e,#c7072b);color:white;font-weight:700;font-size:17px;box-shadow:0 8px 24px rgba(195,0,35,.16);transition:filter .18s,transform .18s}
.primary:hover{filter:brightness(1.12);transform:translateY(-1px)}
.admin-entry{align-self:center;margin-top:16px;padding:7px 16px;border-radius:999px;border:1px solid #332a31;background:#100d10;color:#aaa1aa;font-size:12px;letter-spacing:.02em}
.admin-entry:hover{border-color:#8c1730;color:white}
.login-note{height:16px;margin-top:8px;color:#f17b8d;font-size:12px;text-align:center}
#app{min-height:100vh;display:grid;grid-template-columns:224px minmax(420px,1fr) 286px;gap:12px;padding:13px;background:radial-gradient(ellipse at 50% 0%,#16090d 0,#090708 42%,#060506 100%);position:relative}
.sidebar,.workspace,.rightbar{border:1px solid #211c21;background:rgba(10,9,10,.96);border-radius:17px;min-height:calc(100vh - 26px)}
.sidebar{display:flex;flex-direction:column;padding:17px 12px 12px;min-width:0}
.brand{height:104px;display:flex;align-items:center;justify-content:center;margin:0 4px 12px;border-bottom:1px solid #211d22}
.brand img{width:108px;height:88px;object-fit:contain}
.nav{display:grid;gap:6px}
.nav-btn{display:flex;align-items:center;gap:14px;height:48px;padding:0 14px;border-radius:11px;border:1px solid transparent;background:transparent;color:#aaa4ad;text-align:left;font-size:14px;font-weight:550;transition:background .15s,color .15s}
.nav-btn svg{width:20px;height:20px;stroke:currentColor;flex:none}
.nav-btn:hover{background:#181317;color:white}
.nav-btn.active{background:linear-gradient(100deg,#d90c2e,#a70724);border-color:#f21b3e;color:white;box-shadow:0 7px 20px rgba(170,0,30,.12)}
.sidebar-bottom{margin-top:auto;border-top:1px solid #252026;padding:13px 5px 1px}
.profile{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{width:37px;height:37px;flex:none;border-radius:50%;display:grid;place-items:center;background:#242126;border:1px solid #454047;color:#f4edf1;font-weight:700}
.profile-text{min-width:0;flex:1}
.profile-name{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile-status{font-size:11px;color:#9a929a;margin-top:2px}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px}
.logout{border:0;background:transparent;color:#a69da6;padding:7px;border-radius:8px}
.logout:hover{background:#21171d;color:white}
.workspace{display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:76px;flex:none;display:flex;align-items:center;gap:18px;padding:0 25px;border-bottom:1px solid #252026}
.page-title{font-size:19px;font-weight:700;letter-spacing:-.02em;flex:1}
.top-actions{display:flex;align-items:center;gap:10px}
.icon-btn{width:39px;height:39px;border:1px solid transparent;border-radius:10px;background:transparent;color:#bcb4bd;display:grid;place-items:center}
.icon-btn:hover{background:#191418;color:white;border-color:#30242b}
.icon-btn svg{width:19px;height:19px;stroke:currentColor}
.search{width:min(260px,30vw);height:40px;display:flex;align-items:center;gap:10px;padding:0 13px;border:1px solid #2b252c;border-radius:12px;background:#100e11;color:#a79fa8}
.search svg{width:17px;height:17px;stroke:currentColor;flex:none}
.search input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:white;font-size:13px}
.search input::placeholder{color:#777079}
.content{padding:26px;overflow:auto;flex:1;min-height:0}
.rightbar{padding:22px 18px;display:flex;flex-direction:column;gap:25px;overflow:auto}
.rail-section{display:grid;gap:14px}
.rail-heading{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700}
.rail-count{font-size:11px;color:#8d858e;font-weight:500}
.rail-empty{padding:16px 12px;border:1px solid #211d22;background:#0d0b0e;border-radius:11px;color:#837b85;font-size:12px;line-height:1.5}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:18px}
.section-head h2{font-size:16px;margin:0;font-weight:700}
.section-head p{font-size:12px;color:var(--muted);margin:5px 0 0}
.outline-btn,.soft-btn,.small-red{height:39px;padding:0 14px;border-radius:10px;font-size:12px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.outline-btn{border:1px solid #41303a;background:#100d10;color:#e9e1e7}
.outline-btn:hover{border-color:#ad1735;background:#171015}
.outline-btn svg,.soft-btn svg,.small-red svg{width:16px;height:16px;stroke:currentColor}
.small-red{height:36px;border:1px solid #f21a3c;background:#cb092c;color:white}
.small-red:hover{background:#ed1036}
.soft-btn{border:1px solid #2b252d;background:#171317;color:#cfc7cf}
.soft-btn:hover{background:#211a20;color:white}
.panel{border:1px solid #29232a;border-radius:14px;background:linear-gradient(145deg,#110f12,#0c0a0d);padding:20px}
.panel-title{font-size:13px;font-weight:700}
.muted{color:#918993}
.home-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(230px,.7fr);gap:15px}
.chamber-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:13px}
.chamber-card{min-height:132px;border:1px solid #30252d;border-radius:13px;background:linear-gradient(135deg,#171116,#0c0a0d);padding:17px;display:flex;flex-direction:column;gap:11px;text-align:left;color:#f4eef2;transition:border-color .16s,transform .16s}
.chamber-card:hover{border-color:#9c1832;transform:translateY(-2px)}
.chamber-symbol{width:34px;height:34px;border:1px solid #5b182a;border-radius:10px;display:grid;place-items:center;color:#ff4560;background:#220b12;font-size:15px;font-weight:750}
.chamber-name{font-size:14px;font-weight:700}
.chamber-meta{font-size:11px;color:#918993}
.create-card{min-height:132px;border:1px dashed #56303a;border-radius:13px;background:#100c0f;color:#d8cbd2;display:flex;align-items:center;justify-content:center;gap:12px;flex-direction:column;font-size:12px}
.create-card:hover{background:#180d12;border-color:#d91a3c;color:white}
.create-plus{width:34px;height:34px;border:1px solid #733044;border-radius:50%;display:grid;place-items:center;color:#ff526a;font-size:23px;font-weight:300}
.empty-state{min-height:240px;border:1px solid #272127;border-radius:14px;background:linear-gradient(145deg,#100d10,#0b090b);display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:28px}
.empty-mark{width:52px;height:52px;border:1px solid #4a1a2a;border-radius:15px;display:grid;place-items:center;color:#ff405c;background:#1c0b11;margin-bottom:16px}
.empty-mark svg{width:23px;height:23px;stroke:currentColor}
.empty-state h3{font-size:15px;margin:0 0 7px}
.empty-state p{font-size:12px;color:#928994;margin:0 0 16px;max-width:330px;line-height:1.5}
.friend-layout{display:grid;grid-template-columns:1fr;gap:15px}
.tabs{display:flex;gap:7px;border-bottom:1px solid #282229;padding-bottom:13px;margin-bottom:17px;flex-wrap:wrap}
.tab{height:33px;padding:0 12px;border:1px solid transparent;border-radius:8px;background:transparent;color:#9a919b;font-size:12px}
.tab.active{background:#241016;border-color:#632034;color:white}
.row-item{display:flex;align-items:center;gap:12px;padding:13px 3px;border-bottom:1px solid #211d22}
.row-item:last-child{border-bottom:0}
.row-main{flex:1;min-width:0}
.row-name{font-size:13px;font-weight:650}
.row-sub{font-size:11px;color:#918993;margin-top:3px}
.message-layout{display:grid;grid-template-columns:245px 1fr;min-height:520px;border:1px solid #29232a;border-radius:14px;overflow:hidden}
.message-list{border-right:1px solid #29232a;padding:17px;background:#0d0b0e}
.message-view{display:grid;place-items:center;padding:24px}
.settings-grid{display:grid;grid-template-columns:190px 1fr;gap:15px}
.settings-nav{display:grid;align-content:start;gap:5px}
.settings-nav button{border:0;border-radius:8px;background:transparent;color:#a69da7;text-align:left;padding:11px;font-size:12px}
.settings-nav button.active,.settings-nav button:hover{background:#1b1419;color:white}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:15px 0;border-bottom:1px solid #252027}
.setting-row:last-child{border:0}
.setting-label{font-size:13px;font-weight:650}
.setting-help{font-size:11px;color:#918993;margin-top:4px}
.modal-backdrop{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:18px;backdrop-filter:blur(5px)}
.modal{width:min(100%,450px);border:1px solid #6c1930;border-radius:16px;background:#100d10;box-shadow:0 25px 80px #000;padding:23px}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:19px}
.modal-head h3{font-size:17px;margin:0}
.modal-close{border:0;background:transparent;color:#a89eaa;font-size:23px}
.modal label{display:block;font-size:11px;color:#b9b0ba;margin:14px 0 7px}
.modal input,.modal textarea{width:100%;border:1px solid #342d36;border-radius:9px;background:#0a090b;padding:12px;color:white;outline:0;font-size:13px}
.modal textarea{resize:vertical;min-height:76px}
.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}
.toast{position:fixed;z-index:40;left:50%;bottom:24px;transform:translateX(-50%);padding:11px 16px;border:1px solid #5a2031;border-radius:10px;background:#171014;color:#f6e9ef;font-size:12px;box-shadow:0 10px 35px #000;max-width:calc(100vw - 30px)}
.demo-tag{font-size:10px;letter-spacing:.09em;color:#e88191;border:1px solid #53202d;border-radius:99px;padding:5px 8px;white-space:nowrap}
@media(max-width:1120px){#app{grid-template-columns:205px minmax(0,1fr)}.rightbar{display:none}.home-grid{grid-template-columns:1fr}}
@media(max-width:720px){#app{display:block;padding:0;min-height:100vh}.sidebar{position:fixed;z-index:10;left:0;right:0;bottom:0;height:66px;min-height:0;border-radius:15px 15px 0 0;padding:6px 10px;background:#0d0a0d;display:block}.brand,.sidebar-bottom{display:none}.nav{height:100%;display:flex;justify-content:space-around;align-items:center;gap:3px}.nav-btn{height:49px;min-width:54px;justify-content:center;padding:0 8px;gap:0;flex:1;flex-direction:column;font-size:9px}.nav-btn svg{width:19px;height:19px}.workspace{min-height:calc(100vh - 78px);border-radius:0;border:0}.topbar{height:65px;padding:0 16px}.content{padding:19px 15px 30px}.search{width:42px;padding:0;justify-content:center}.search input{display:none}.top-actions{gap:2px}.page-title{font-size:17px}.login-card{padding:25px 20px 22px}.login-logo{height:105px;margin-bottom:13px}.message-layout{grid-template-columns:1fr;min-height:430px}.message-list{display:none}.settings-grid{grid-template-columns:1fr}.settings-nav{display:flex;overflow:auto}.settings-nav button{white-space:nowrap}.chamber-grid{grid-template-columns:1fr}.section-head{align-items:flex-start}.section-head .outline-btn{flex:none}}
@media(min-width:721px) and (max-height:650px){.sidebar,.workspace,.rightbar{min-height:calc(100vh - 26px)}.brand{height:75px}.content{padding-top:18px}}
</style>
</head>
<body>
<section id="login">
  <div class="login-bg"></div>
  <div class="login-card">
    <img class="login-logo" src="assets/nexus-mark.svg" alt="Nexus">
    <form class="login-form" id="loginForm">
      <div class="field">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c.6-4.1 3.3-6 8-6s7.4 1.9 8 6"/></svg>
        <input id="loginUser" autocomplete="username" placeholder="Username or Email" aria-label="Username or Email">
      </div>
      <div class="field">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg>
        <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password">
        <button type="button" id="togglePassword" aria-label="Show password" title="Show password">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path d="m3 3 18 18"/></svg>
        </button>
      </div>
      <button class="primary" type="submit">Log In</button>
    </form>
    <button class="admin-entry" id="adminEntry" type="button">Admin</button>
    <div class="login-note" id="loginNote" aria-live="polite"></div>
  </div>
</section>
<section id="app" class="hidden" aria-label="Nexus preview">
  <aside class="sidebar">
    <div class="brand"><img src="assets/nexus-mark.svg" alt="Nexus"></div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-bottom">
      <div class="profile">
        <div class="avatar">A</div>
        <div class="profile-text"><div class="profile-name">Admin Preview</div><div class="profile-status"><span class="status-dot"></span>Preview mode</div></div>
        <button class="logout" id="exitPreview" title="Exit preview" aria-label="Exit preview">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"/></svg>
        </button>
      </div>
    </div>
  </aside>
  <main class="workspace">
    <header class="topbar">
      <div class="page-title" id="pageTitle">Home</div>
      <div class="top-actions">
        <span class="demo-tag">PREVIEW</span>
        <button class="icon-btn" id="requestsQuick" title="Friend requests" aria-label="Friend requests">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M16 11h6"/></svg>
        </button>
        <label class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="7"/><path d="m16 16 5 5"/></svg>
          <input id="globalSearch" placeholder="Search" aria-label="Search Nexus">
        </label>
      </div>
    </header>
    <div class="content" id="content"></div>
  </main>
  <aside class="rightbar" id="rightbar"></aside>
</section>
<div id="modalRoot"></div>
<div id="toastRoot" aria-live="polite"></div>
<script>
(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s)};
var icons={
home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
friends:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M20 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
chambers:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
messages:'<path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 9 9 0 0 1-4-.9L3 21l1.9-5.5a9 9 0 0 1-.9-4A8.5 8.5 0 0 1 12.5 3h.5a8.5 8.5 0 0 1 8 8z"/>',
settings:'<circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.3 1-1.3 2.2-1.6-.6a8 8 0 0 1-1.5.9l-.3 1.7h-2.6l-.3-1.7a8 8 0 0 1-1.5-.9l-1.6.6-1.3-2.2 1.3-1a8 8 0 0 1 0-1.8l-1.3-1 1.3-2.2 1.6.6a8 8 0 0 1 1.5-.9l.3-1.7h2.6l.3 1.7a8 8 0 0 1 1.5.9l1.6-.6 1.3 2.2-1.3 1a8 8 0 0 1 0 1.8z"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M16 11h6"/>',
search:'<circle cx="10.8" cy="10.8" r="7"/><path d="m16 16 5 5"/>',
chat:'<path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 9 9 0 0 1-4-.9L3 21l1.9-5.5a9 9 0 0 1-.9-4A8.5 8.5 0 0 1 12.5 3h.5a8.5 8.5 0 0 1 8 8z"/>',
compass:'<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2.2 4.8-4.8 2.2 2.2-4.8z"/>'
};
function ico(name){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(icons[name]||icons.home)+'</svg>'}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function read(key){try{return JSON.parse(localStorage.getItem('nexus-preview-'+key)||'[]')}catch(e){return []}}
function write(key,v){try{localStorage.setItem('nexus-preview-'+key,JSON.stringify(v))}catch(e){}}
var chambers=read('chambers'),outgoing=read('requests'),activePage='home',friendTab='all',chamberView='mine',selectedChamber=null;
var navItems=[['home','Home','home'],['friends','Friends','friends'],['chambers','Chambers','chambers'],['messages','Messages','messages'],['settings','Settings','settings']];
function showToast(msg){var root=$('#toastRoot');root.innerHTML='<div class="toast">'+esc(msg)+'</div>';window.clearTimeout(showToast.t);showToast.t=window.setTimeout(function(){root.innerHTML=''},2600)}
function enterPreview(){ $('#login').classList.add('hidden');$('#app').classList.remove('hidden');renderApp() }
function exitPreview(){ $('#app').classList.add('hidden');$('#login').classList.remove('hidden');$('#loginNote').textContent='' }
$('#adminEntry').addEventListener('click',enterPreview);
$('#exitPreview').addEventListener('click',exitPreview);
$('#loginForm').addEventListener('submit',function(e){e.preventDefault();$('#loginNote').textContent='Live sign-in is not connected yet.'});
$('#togglePassword').addEventListener('click',function(){var p=$('#loginPassword');p.type=p.type==='password'?'text':'password';this.setAttribute('aria-label',p.type==='password'?'Show password':'Hide password')});
function renderNav(){ $('#nav').innerHTML=navItems.map(function(n){return '<button class="nav-btn '+(activePage===n[0]?'active':'')+'" data-page="'+n[0]+'">'+ico(n[2])+'<span>'+n[1]+'</span></button>'}).join('') }
function emptyState(mark,title,desc,button,action){return '<div class="empty-state"><div class="empty-mark">'+ico(mark)+'</div><h3>'+title+'</h3><p>'+desc+'</p>'+(button?'<button class="small-red" data-action="'+action+'">'+ico('plus')+button+'</button>':'')+'</div>'}
function renderRail(){
var req=outgoing.length;
$('#rightbar').innerHTML='<section class="rail-section"><div class="rail-heading"><span>Friend requests</span><span class="rail-count">'+req+' sent</span></div><div class="rail-empty">'+(req?req.length+' request'+(req.length===1?'':'s')+' sent from this preview.':'No pending requests.')+'</div><button class="soft-btn" data-page="friends">Open Friends</button></section><section class="rail-section"><div class="rail-heading"><span>Online friends</span><span class="rail-count">0 online</span></div><div class="rail-empty">No friends online yet.</div></section>';
}
function renderHome(){
return '<div class="home-grid"><section><div class="section-head"><div><h2>Your Chambers</h2><p>Spaces you have joined</p></div><button class="outline-btn" data-page="chambers">View all</button></div>'+(chambers.length?'<div class="chamber-grid">'+chambers.slice(0,2).map(chamberCard).join('')+'</div>':emptyState('chambers','No Chambers yet','Create a Chamber for the people you want to bring together.','Create Chamber','create-chamber'))+'</section><section><div class="section-head"><div><h2>Friends</h2><p>Your connections</p></div><button class="outline-btn" data-page="friends">Open</button></div><div class="panel" style="min-height:142px;display:flex;align-items:center;justify-content:center;text-align:center"><div><div class="muted" style="font-size:12px;margin-bottom:12px">No friends added yet</div><button class="small-red" data-page="friends">'+ico('plus')+'Add Friend</button></div></div></section><section style="grid-column:1/-1"><div class="section-head"><div><h2>Recent activity</h2></div></div><div class="panel muted" style="font-size:12px">Nothing new</div></section></div>';
}
function chamberCard(c){return '<button class="chamber-card" data-chamber="'+esc(c.id)+'"><span class="chamber-symbol">'+esc((c.name||'C').trim().slice(0,1).toUpperCase())+'</span><span class="chamber-name">'+esc(c.name)+'</span><span class="chamber-meta">Created in this preview</span></button>'}
function renderChambers(){
if(selectedChamber){var c=chambers.find(function(x){return x.id===selectedChamber});if(!c){selectedChamber=null}else{return '<div class="section-head"><div><h2>'+esc(c.name)+'</h2><p>'+esc(c.description||'')+'</p></div><button class="outline-btn" data-action="back-chambers">← Chambers</button></div><div class="message-layout" style="min-height:470px"><div class="message-list"><div class="panel-title" style="margin-bottom:15px">CHANNELS</div><div class="rail-empty" style="margin-bottom:8px;color:#eee">#　general</div><div class="rail-empty">#　announcements</div></div><div class="message-view"><div style="text-align:center"><div class="empty-mark" style="margin:0 auto 14px">'+ico('chat')+'</div><div class="panel-title"># general</div><p class="muted" style="font-size:12px">This Chamber is ready for its first conversation.</p></div></div></div>'}}
var grid=chambers.length?'<div class="chamber-grid">'+chambers.map(chamberCard).join('')+'<button class="create-card" data-action="create-chamber"><span class="create-plus">+</span>Create Chamber</button></div>':emptyState('chambers','No Chambers yet','Your Chambers will appear here.','Create Chamber','create-chamber');
return '<div class="section-head"><div><h2>Chambers</h2><p>Your communities, all in one place</p></div><button class="small-red" data-action="create-chamber">'+ico('plus')+'Create Chamber</button></div><div class="tabs"><button class="tab '+(chamberView==='mine'?'active':'')+'" data-chamber-tab="mine">Your Chambers</button><button class="tab '+(chamberView==='discover'?'active':'')+'" data-chamber-tab="discover">Discover</button></div>'+(chamberView==='mine'?grid:emptyState('compass','Nothing to explore yet','Public Chambers will be discoverable here.','','')) ;
}
function renderFriends(){
var pending=outgoing;
var body=friendTab==='requests'?(pending.length?pending.map(function(r){return '<div class="row-item"><div class="avatar">'+esc(r.name.slice(0,1).toUpperCase())+'</div><div class="row-main"><div class="row-name">'+esc(r.name)+'</div><div class="row-sub">Request sent</div></div><span class="demo-tag">PENDING</span></div>'}).join(''):'<div class="rail-empty">No friend requests.</div>'):'<div class="empty-state" style="min-height:300px"><div class="empty-mark">'+ico('friends')+'</div><h3>No friends yet</h3><p>Add someone by their username to start building your friends list.</p><button class="small-red" data-action="add-friend">'+ico('plus')+'Add Friend</button></div>';
return '<div class="section-head"><div><h2>Friends</h2><p>Manage your connections</p></div><button class="small-red" data-action="add-friend">'+ico('plus')+'Add Friend</button></div><div class="tabs"><button class="tab '+(friendTab==='all'?'active':'')+'" data-friend-tab="all">All Friends</button><button class="tab '+(friendTab==='requests'?'active':'')+'" data-friend-tab="requests">Requests'+(pending.length?' ('+pending.length+')':'')+'</button></div><div class="panel">'+body+'</div>';
}
function renderMessages(){return '<div class="section-head"><div><h2>Messages</h2><p>Direct conversations</p></div><button class="outline-btn" data-page="friends">Find a friend</button></div><div class="message-layout"><div class="message-list"><div class="search" style="width:100%">'+ico('search')+'<input placeholder="Find a conversation" aria-label="Find a conversation"></div><div class="rail-empty" style="margin-top:14px">No conversations</div></div><div class="message-view">'+emptyState('chat','No messages yet','Your direct conversations will show up here.','Find Friends','friends')+'</div></div>'}
function renderSettings(){return '<div class="section-head"><div><h2>Settings</h2><p>Preview preferences</p></div></div><div class="settings-grid"><div class="settings-nav"><button class="active">My Account</button><button>Appearance</button><button>Privacy</button></div><div class="panel"><div class="setting-row"><div><div class="setting-label">Account</div><div class="setting-help">Admin Preview</div></div><span class="demo-tag">TEMPORARY</span></div><div class="setting-row"><div><div class="setting-label">Theme</div><div class="setting-help">Dark · Crimson</div></div></div><div class="setting-row"><div><div class="setting-label">Authentication</div><div class="setting-help">Not connected in this preview</div></div></div></div></div>'}
function renderApp(){
renderNav();$('#pageTitle').textContent=navItems.find(function(n){return n[0]===activePage})[1];
var html=activePage==='home'?renderHome():activePage==='friends'?renderFriends():activePage==='chambers'?renderChambers():activePage==='messages'?renderMessages():renderSettings();
$('#content').innerHTML=html;renderRail();
}
function openModal(kind){
var html='';
if(kind==='chamber'){html='<div class="modal-backdrop" data-close-modal><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h3 id="modalTitle">Create a Chamber</h3><button class="modal-close" data-close-modal aria-label="Close">×</button></div><form id="chamberForm"><label for="chamberName">Chamber name</label><input id="chamberName" maxlength="32" required placeholder="Name your Chamber"><label for="chamberDescription">Description (optional)</label><textarea id="chamberDescription" maxlength="120" placeholder="What is this Chamber for?"></textarea><div class="modal-actions"><button type="button" class="soft-btn" data-close-modal>Cancel</button><button class="small-red" type="submit">Create Chamber</button></div></form></div></div>'}
if(kind==='friend'){html='<div class="modal-backdrop" data-close-modal><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h3 id="modalTitle">Add a Friend</h3><button class="modal-close" data-close-modal aria-label="Close">×</button></div><form id="friendForm"><label for="friendName">Username</label><input id="friendName" maxlength="24" required placeholder="Enter a username"><div class="modal-actions"><button type="button" class="soft-btn" data-close-modal>Cancel</button><button class="small-red" type="submit">Send Request</button></div></form></div></div>'}
$('#modalRoot').innerHTML=html;
var field=kind==='chamber'?'#chamberName':'#friendName';if($(field))$(field).focus();
}
function closeModal(){$('#modalRoot').innerHTML=''}
document.addEventListener('click',function(e){
var nav=e.target.closest('[data-page]');if(nav){activePage=nav.dataset.page;selectedChamber=null;renderApp();return}
var action=e.target.closest('[data-action]');if(action){var a=action.dataset.action;if(a==='create-chamber')openModal('chamber');if(a==='add-friend')openModal('friend');if(a==='back-chambers'){selectedChamber=null;renderApp()}if(a==='friends'){activePage='friends';renderApp()}return}
var c=e.target.closest('[data-chamber]');if(c){selectedChamber=c.dataset.chamber;activePage='chambers';renderApp();return}
var ft=e.target.closest('[data-friend-tab]');if(ft){friendTab=ft.dataset.friendTab;renderApp();return}
var ct=e.target.closest('[data-chamber-tab]');if(ct){chamberView=ct.dataset.chamberTab;selectedChamber=null;renderApp();return}
if(e.target.closest('[data-close-modal]'))closeModal();
});
document.addEventListener('submit',function(e){
if(e.target.id==='chamberForm'){e.preventDefault();var name=$('#chamberName').value.trim();if(!name)return;var c={id:String(Date.now()),name:name,description:$('#chamberDescription').value.trim()};chambers.unshift(c);write('chambers',chambers);closeModal();selectedChamber=null;activePage='chambers';chamberView='mine';renderApp();showToast('Chamber created in this preview');}
if(e.target.id==='friendForm'){e.preventDefault();var name=$('#friendName').value.trim().replace(/^@/,'');if(!name)return;if(outgoing.some(function(r){return r.name.toLowerCase()===name.toLowerCase()})){showToast('Request already exists');return}outgoing.unshift({name:name,id:String(Date.now())});write('requests',outgoing);closeModal();activePage='friends';friendTab='requests';renderApp();showToast('Preview request added');}
});
$('#requestsQuick').addEventListener('click',function(){activePage='friends';friendTab='requests';renderApp()});
$('#globalSearch').addEventListener('keydown',function(e){if(e.key==='Enter'&&this.value.trim()){activePage='friends';friendTab='all';renderApp();showToast('Search is ready for the account system');this.value=''}});
})();
</script>
</body>
</html>
